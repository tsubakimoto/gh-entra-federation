name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Expected a stable release tag: vMAJOR.MINOR.PATCH'
          }
          "version=$($env:TAG.Substring(1))" >> $env:GITHUB_OUTPUT
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gh-entra-federation-*
          merge-multiple: true
          path: assets
      - name: Publish four executable assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          $expected = @(
            'gh-entra-federation-windows-amd64.exe',
            'gh-entra-federation-windows-arm64.exe',
            'gh-entra-federation-linux-amd64',
            'gh-entra-federation-linux-arm64'
          )
          $assets = @(Get-ChildItem -Path assets -File)
          if ($assets.Count -ne 4) { throw 'Expected exactly four executable assets.' }
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path 'assets' $name))) { throw "Missing asset: $name" }
          }
          gh release create $env:TAG @($assets.FullName) --repo $env:GH_REPO --target $env:COMMIT --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
